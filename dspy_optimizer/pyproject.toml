[project]
name = "dspy-optimizer"
version = "0.1.0"
description = "DSPy + MIPROv2 prompt optimization for redactor-v4"
requires-python = ">=3.12"
dependencies = [
    "dspy[optuna]>=2.6.0",
    "asyncpg>=0.30.0",
    "anthropic>=0.50.0",
    "openai>=1.80.0",
    "python-dotenv>=1.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
dspy-opt = "dspy_optimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dspy_optimizer"]
